# vim:set ft=sh

# MODULES
# Early KMS per Intel Graphics (i915) e driver NVMe per inizializzazione istantanea
MODULES=(i915 nvme)

# BINARIES
BINARIES=()

# FILES
FILES=()

# HOOKS
# Initramfs basato nativamente su systemd (senza overhead dell'hook base/busybox)
HOOKS=(systemd autodetect block filesystems)

# COMPRESSION
# LZ4 velocizza la decompressione dell'initramfs su SSD NVMe
COMPRESSION="lz4"

# MODULES_DECOMPRESS
# Moduli già decompressi per azzerare la latenza in early userspace
MODULES_DECOMPRESS="yes"
