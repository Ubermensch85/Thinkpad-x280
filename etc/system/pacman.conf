#
# /etc/pacman.conf
#

[options]
# RootDir     = /
# DBPath      = /var/lib/pacman/
# CacheDir    = /var/cache/pacman/pkg/
# LogFile     = /var/log/pacman.log
# GPGDir      = /etc/pacman.d/gnupg/
# HookDir     = /etc/pacman.d/hooks/
HoldPkg      = pacman glibc
Architecture = auto
#XferCommand = /usr/bin/curl --retry 3 --retry-delay 3 -L -C - -f -o %o %u

# Opzione estetica (Barra di pacman in stile Retro)
ILoveCandy

# Pacman non aggiornerà i pacchetti elencati qui
#IgnorePkg = transmission-gtk
#IgnoreGroup =

# Opzioni varie
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES
# I repository sono ordinati per priorità. 
# Arch Linux (core/extra) ha la precedenza.
#

[core]
Include = /etc/pacman.d/mirrorlist

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
