# Configurazione audio unificata per ThinkPad ALC257
# - Driver: snd-hda-intel
# - Codec: Realtek ALC257 (Lenovo-specific)
# - Ottimizzazioni: bassa latenza, no risparmio energetico

# Forza il codec Realtek come dispositivo primario (index=0)
options snd-hda-codec-realtek index=0

# Modello corretto per ThinkPad ALC257 (rimuove alc257-dell1 conflittuale)
options snd-hda-intel model=alc257-lenovo

# Disabilita il risparmio energetico (previene crepitii)
options snd-hda-intel power_save=0

# Correzione posizionamento buffer audio (evita xrun)
options snd-hda-intel position_fix=1

# Ottimizza la sincronizzazione DMA (bdl_pos_adj)
options snd-hda-intel bdl_pos_adj=1,1
