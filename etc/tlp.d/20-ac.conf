# /etc/tlp.d/20-ac.conf
# Profilo PRF (Rete elettrica) - Prestazioni e latenza minima

# CPU (intel_pstate)
CPU_SCALING_GOVERNOR_ON_PRF=powersave
CPU_ENERGY_PERF_POLICY_ON_PRF=balance_performance
CPU_BOOST_ON_PRF=1

# PCIe ASPM e Runtime PM
PCIE_ASPM_ON_PRF=performance
AHCI_RUNTIME_PM_ON_PRF=on
RUNTIME_PM_ON_PRF=on

# Periferiche e Audio
SOUND_POWER_SAVE_ON_PRF=0
WIFI_PWR_ON_PRF=off
