# /etc/tlp.d/20-ac.conf
# Modalità AC - Massime prestazioni (nessun risparmio energetico con cavo collegato)

# CPU (intel_pstate)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_BOOST_ON_AC=1

# PCIe ASPM e NVMe/Disk Runtime PM (disabilitati su AC per latenza zero)
PCIE_ASPM_ON_AC=performance
AHCI_RUNTIME_PM_ON_AC=on

# Periferiche e Audio
SOUND_POWER_SAVE_ON_AC=0
RUNTIME_PM_ON_AC=on
WIFI_PWR_ON_AC=off
