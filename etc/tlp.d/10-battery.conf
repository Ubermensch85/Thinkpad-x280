# /etc/tlp.d/10-battery.conf
# Modalità BATTERIA (Profili BAL e SAV) - Efficienza energetica e contenimento termico
# Attivo solo a cavo di alimentazione scollegato

# CPU (intel_pstate)
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_BAT=0
CPU_BOOST_ON_SAV=0

# PCIe ASPM e NVMe/Disk Runtime PM (attivi solo a batteria)
PCIE_ASPM_ON_BAT=powersave
PCIE_ASPM_ON_SAV=powersave
AHCI_RUNTIME_PM_ON_BAT=auto

# Periferiche e Audio
SOUND_POWER_SAVE_ON_BAT=1
RUNTIME_PM_ON_BAT=auto
WIFI_PWR_ON_BAT=on
