# /etc/tlp.d/00-thresholds.conf
# Impostazioni globali, profili TLP 1.10 e soglie batteria ThinkPad

# Abilitazione TLP
TLP_ENABLE=1

# Nuove regole profili TLP 1.10+:
# Switch automatico continuo al cambio alimentazione (AC <-> Batteria)
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
TLP_PROFILE_DEFAULT=PRF

# Soglie di ricarica batteria BAT0 (ThinkPad X280)
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
RESTORE_THRESHOLDS_ON_BAT=1
