# /etc/tlp.d/00-thresholds.conf
# Impostazioni globali, profili TLP 1.11+ e soglie batteria ThinkPad

TLP_ENABLE=1

# Switch automatico profili al cambio alimentazione (1=auto, 2=smart)
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
TLP_PROFILE_DEFAULT=PRF

# Soglie di ricarica batteria BAT0 (ThinkPad X280)
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
RESTORE_THRESHOLDS_ON_BAT=1
