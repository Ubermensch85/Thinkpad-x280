vo=gpu
gpu-context=wayland
hwdec=vaapi          # più stabile di auto-safe su Intel con Wayland/multi-monitor
hwdec-codecs=all

scale=spline36
cscale=spline36
dscale=bilinear

audio-display=no
ao=pipewire
volume-max=150
video-sync=display-resample

# --- OTTIMIZZAZIONE AUDIO THINKPAD X280 ---
# 1. highpass=f=120: taglia le frequenze sotto 120Hz che le casse dell'X280 non reggono (elimina il gracchio meccanico)
# 2. dynaudnorm: normalizza e alza il parlato e i suoni bassi fino a +12dB, limitando i picchi a -0.45dB (zero clipping)
af="lavfi=[highpass=f=120,dynaudnorm=f=150:g=15:m=12:p=0.95:t=1]"

keep-open=yes
save-position-on-quit=yes
ytdl-format="bestvideo[height<=1080]+bestaudio/best"

# Profilo per monitor esterno HDMI
[hdmi]
profile-desc=Monitor HDMI esterno
video-sync=display-resample
interpolation=yes
tscale=oversample
icc-profile-auto=yes   # usa il profilo colore del monitor se disponibile
