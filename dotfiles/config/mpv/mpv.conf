vo=gpu
gpu-context=wayland
hwdec=vaapi          # più stabile di auto-safe su Intel con Wayland/multi-monitor
hwdec-codecs=all

scale=spline36
cscale=spline36
dscale=bilinear

audio-display=no
ao=pipewire
volume-max=150
video-sync=display-resample

# --- OTTIMIZZAZIONE AUDIO THINKPAD X280 ---
# 1. highpass=f=80: protegge dal sub-basso incontrollato (<80Hz) lasciando intatto il corpo sonoro (80-120Hz)
# 2. dynaudnorm: compressione dinamica ad alto guadagno (+15dB max sui suoni deboli) con picco sicuro a 0.98
af="lavfi=[highpass=f=80,dynaudnorm=f=150:g=15:m=15:p=0.98:t=1]"

keep-open=yes
save-position-on-quit=yes
ytdl-format="bestvideo[height<=1080]+bestaudio/best"

# Profilo per monitor esterno HDMI
[hdmi]
profile-desc=Monitor HDMI esterno
video-sync=display-resample
interpolation=yes
tscale=oversample
icc-profile-auto=yes   # usa il profilo colore del monitor se disponibile
