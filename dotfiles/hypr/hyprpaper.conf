# ~/.config/hypr/hyprpaper.conf
# Ottimizzato per 1080p nativo su ThinkPad X280 (Intel HD 620)
ipc = false
splash = false

# Monitor vuoto = si applica a qualsiasi monitor (eDP-1 interno o monitor esterni HDMI/DP)
wallpaper {
    monitor = 
    path = /home/ubermensch/Immagini/van-1080p.jpeg
    fit_mode = cover
}
