# ThinkPad X280 - DSP Nativo PipeWire (Zero Demoni, Zero GUI, Zero Boot Overhead)
# Catena di filtri audio calibrata per gli altoparlanti integrati:
# 1. High-Pass (120 Hz): elimina il sub-basso che causa vibrazioni e gracchi della scocca
# 2. Warmth (400 Hz): corpo e calore alle voci maschili/femminili (+1.5 dB)
# 3. Presence (2500 Hz): massima intelligibilità del parlato e chiarezza a basso volume (+3.5 dB)
# 4. Air (7000 Hz): brillantezza e definizione sui dettagli (+1.5 dB)

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Audio Ottimizzato ThinkPad X280"
            media.name       = "Audio Ottimizzato ThinkPad X280"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_highpass
                        label = bq_highpass
                        control = { "Freq" = 120.0 "Q" = 0.707 }
                    }
                    {
                        type  = builtin
                        name  = eq_warmth
                        label = bq_peaking
                        control = { "Freq" = 400.0 "Q" = 1.0 "Gain" = 1.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_presence
                        label = bq_peaking
                        control = { "Freq" = 2500.0 "Q" = 1.2 "Gain" = 3.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_air
                        label = bq_highshelf
                        control = { "Freq" = 7000.0 "Q" = 0.707 "Gain" = 1.5 }
                    }
                ]
                links = [
                    { output = "eq_highpass:Out" input = "eq_warmth:In" }
                    { output = "eq_warmth:Out" input = "eq_presence:In" }
                    { output = "eq_presence:Out" input = "eq_air:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.thinkpad_x280"
                media.class = Audio/Sink
                priority.driver = 1009
                priority.session = 1009
            }
            playback.props = {
                node.name   = "effect_output.thinkpad_x280"
                node.passive = true
            }
        }
    }
]
